name: Update boss schedule and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Refresh official boss schedule
        run: python scripts/update_bosses.py
      - name: Build site search index
        run: python scripts/build_site_search.py
      - name: Restore Master of Fate guide images
        run: |
          mkdir -p dist/assets/guides/master-of-fate
          base64 -d scripts/image-payloads/master-of-fate-20260922/miracle-researcher.b64 > dist/assets/guides/master-of-fate/miracle-researcher.webp
          cat scripts/image-payloads/master-of-fate-20260922/miracle-researcher-menu.part*.b64 | base64 -d > dist/assets/guides/master-of-fate/miracle-researcher-menu.webp
          test -s dist/assets/guides/master-of-fate/miracle-researcher.webp
          test -s dist/assets/guides/master-of-fate/miracle-researcher-menu.webp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
