name: Fetch enhancement guide source
on:
  push:
    paths:
      - '.github/workflows/enhancement-guide-source.yml'
  workflow_dispatch:

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and extract official guide
        run: |
          python - <<'PY'
          import urllib.request, re
          from html.parser import HTMLParser
          url='https://www.xenrebirth.com/lexicon/index.php?entry/51-alchemist-blacksmith-enhancement-guide/'
          req=urllib.request.Request(url,headers={'User-Agent':'XenRebirthJP-GuideSync/1.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          open('/tmp/guide.html','w',encoding='utf-8').write(html)
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.out=[]; self.skip=0
              def handle_starttag(self,t,a):
                  if t in ('script','style','noscript'): self.skip+=1
                  if not self.skip and t in ('h1','h2','h3','h4','h5','p','li','tr','br'): self.out.append('\n')
              def handle_endtag(self,t):
                  if t in ('script','style','noscript') and self.skip: self.skip-=1
                  if not self.skip and t in ('h1','h2','h3','h4','h5','p','li','tr'): self.out.append('\n')
              def handle_data(self,d):
                  if not self.skip: self.out.append(d)
          p=P(); p.feed(html)
          text=''.join(p.out)
          text=re.sub(r'[ \t]+',' ',text)
          text=re.sub(r'\n\s*\n+', '\n', text)
          # Keep the guide body beginning at its title and stop before footer/navigation noise when possible.
          start=text.lower().find('alchemist')
          if start>=0: text=text[start:]
          print('OFFICIAL GUIDE TEXT BEGIN')
          print(text[:45000])
          print('OFFICIAL GUIDE TEXT END')
          PY
