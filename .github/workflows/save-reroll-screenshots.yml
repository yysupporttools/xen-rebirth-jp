name: Save reroll screenshots locally
on:
  push:
    paths:
      - '.github/workflows/save-reroll-screenshots.yml'
  workflow_dispatch:
jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download official screenshots with site session
        run: |
          mkdir -p dist/assets/guides/master-of-fate
          python - <<'PY'
          import urllib.request, urllib.error, http.cookiejar, pathlib
          page="https://www.xenrebirth.com/lexicon/index.php?entry/161-reroll-master-of-fate/"
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36"
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(url, referer=None):
              headers={"User-Agent":ua,"Accept":"image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8","Accept-Language":"en-US,en;q=0.9"}
              if referer: headers["Referer"]=referer
              req=urllib.request.Request(url,headers=headers)
              with opener.open(req,timeout=30) as r:
                  return r.read(),r.headers.get("Content-Type",""),r.geturl()
          # Establish the same session/cookies as the guide page.
          try:
              data,ct,final=get(page)
              print("PAGE",ct,len(data),final,"cookies",[(c.name,c.domain) for c in jar])
          except Exception as e:
              print("PAGE SESSION FAILED",repr(e))
          entries=[
            (18376,"xen-rebirth-miracle-researcher-npc","dist/assets/guides/master-of-fate/miracle-researcher.jpg"),
            (18375,"xen-rebirth-miracle-researcher-npc-two","dist/assets/guides/master-of-fate/miracle-researcher-menu.jpg"),
          ]
          for ident,name,out in entries:
              bases=[
                f"https://www.xenrebirth.com/index.php?attachment/{ident}-{name}-jpg/&thumbnail=1",
                f"https://www.xenrebirth.com/index.php?attachment/{ident}-{name}-jpg/",
              ]
              saved=False
              for url in bases:
                  try:
                      data,ct,final=get(url,page)
                      print("TRY",url,"=>",ct,len(data),final,data[:12])
                      if ct.startswith("image/") or data[:3]==b"\xff\xd8\xff" or data[:8]==b"\x89PNG\r\n\x1a\n":
                          pathlib.Path(out).write_bytes(data); saved=True; break
                  except Exception as e:
                      print("TRY FAILED",url,repr(e))
              if not saved:
                  raise SystemExit("Could not retrieve official image "+str(ident))
          PY
          file dist/assets/guides/master-of-fate/*
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/guides/master-of-fate/
          git diff --cached --quiet && exit 0
          git commit -m "Store Master of Fate screenshots locally"
          git push
