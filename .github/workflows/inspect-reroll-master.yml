name: Inspect reroll master source
on:
  push:
    paths:
      - '.github/workflows/inspect-reroll-master.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official reroll guide
        run: |
          python -m pip install -q beautifulsoup4
          python - <<'PY'
          import urllib.request
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://www.xenrebirth.com/lexicon/index.php?entry/161-reroll-master-of-fate/'
          req=urllib.request.Request(url,headers={'User-Agent':'XenRebirthJP-GuideSync/1.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          soup=BeautifulSoup(html,'html.parser')
          print('TITLE:',soup.title.get_text(' ',strip=True) if soup.title else '')
          roots=[]
          for sel in ['.lexiconEntryContent','.messageText','.htmlContent','.content','article','main']:
              for node in soup.select(sel):
                  txt=node.get_text(' ',strip=True)
                  if len(txt)>500 and ('Reroll' in txt or 'Master of Fate' in txt):
                      roots.append((len(txt),sel,node))
          root=min(roots,key=lambda x:x[0])[2] if roots else soup
          print('--- CONTENT ---')
          seen=set()
          for el in root.find_all(['h1','h2','h3','h4','p','li','tr']):
              t=' '.join(el.get_text(' ',strip=True).split())
              if not t or t in seen: continue
              seen.add(t)
              print(f'[{el.name}] {t}')
          print('--- IMAGES ---')
          for i,img in enumerate(root.find_all('img'),1):
              cand=next((img.get(k) for k in ['data-src','data-original','data-url','data-lazy-src','src'] if img.get(k)),None)
              if cand:
                  print(f'IMAGE {i}: {urljoin(url,cand)} | alt={img.get("alt","")}')
          PY
