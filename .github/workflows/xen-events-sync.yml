name: Xen Rebirth event sync Ver.10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xen-events-sync.yml"
      - "scripts/sync-xen-events.js"

  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: read

jobs:
  sync-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync OpenAI key to Supabase AI backend
        run: |
          node - <<'NODE'
          const url = "https://dzxxjtmpcfsmvdgkcwvn.supabase.co/rest/v1/app_secrets?on_conflict=name";
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const value = process.env.OPENAI_API_KEY;
          const r = await fetch(url, {
            method: "POST",
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`,
              "Content-Type": "application/json",
              Prefer: "resolution=merge-duplicates,return=minimal"
            },
            body: JSON.stringify([{ name: "OPENAI_API_KEY", value, updated_at: new Date().toISOString() }])
          });
          if (!r.ok) throw new Error("Secret sync failed: " + r.status + " " + (await r.text()).slice(0,500));
          console.log("OpenAI server key synced.");
          NODE
      - name: Smoke test OpenAI screen analyzer
        if: github.event_name == 'push'
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          (async () => {
            const dir = "scripts/image-payloads/master-of-fate-20260922";
            const parts = [
              "miracle-researcher-menu.part1.b64",
              "miracle-researcher-menu.part2.b64",
              "miracle-researcher-menu.part3.b64"
            ];
            const b64 = parts.map(x => fs.readFileSync(dir + "/" + x, "utf8").trim()).join("");
            const bytes = Buffer.from(b64, "base64");
            const hash = crypto.createHash("sha256").update(bytes).digest("hex");
            const r = await fetch("https://dzxxjtmpcfsmvdgkcwvn.supabase.co/functions/v1/analyze-game-screen", {
              method: "POST",
              headers: {
                Origin: "https://yysupporttools.github.io",
                "x-xen-client": "capture-v1",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ image: "data:image/webp;base64," + b64, image_hash: hash })
            });
            const body = await r.text();
            if (!r.ok) throw new Error("AI screen analyzer failed: " + r.status + " " + body.slice(0,800));
            const data = JSON.parse(body);
            if (!data.english_text) throw new Error("AI screen analyzer returned no English text");
            console.log("AI screen analyzer OK:", {
              npc_name: data.npc_name,
              quest_name_en: data.quest_name_en,
              confidence: data.confidence,
              cached: data._meta?.cached,
              english_chars: data.english_text.length
            });
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
      - name: Sync official events to Supabase
        run: node scripts/sync-xen-events.js
