<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000"><rect width="1100" height="1000" fill="#102632"/><style>text{font-family:Arial,'Yu Gothic',sans-serif;fill:#ecf5fb;font-size:22px}.small{font-size:18px;fill:#afc9da}.floor{fill:#526a76;stroke:#a9c4cf;stroke-width:4}.wall{fill:#142b38;stroke:#78919e;stroke-width:3}.path{fill:none;stroke:#ffdc73;stroke-width:5;stroke-dasharray:12 8}</style><text x="40" y="55" style="font-size:32px">Sleepless Grave (Level 2)</text><text x="40" y="95" class="small">全体の接続が未確定のため、撮影区間ごとの通路形状を表示しています。</text><text x="50" y="155">① 到着付近：横通路と曲がり角</text><path class="floor" d="M60 190H490V450H370V310H60Z"/><rect class="wall" x="60" y="190" width="310" height="55"/><circle cx="460" cy="275" r="19" fill="#d9a64f"/><path class="path" d="M450 270H115"/><text x="70" y="485" class="small">約59〜80秒：壁沿いに移動</text>
<text x="600" y="155">② 幅のある縦通路と横通路</text><path class="floor" d="M640 190H1000V310H780V460H640Z"/><rect class="wall" x="795" y="330" width="205" height="130"/><path class="path" d="M710 430V255H970"/><text x="610" y="485" class="small">約90〜115秒：通路を曲がる</text>
<text x="50" y="555">③ 柱・壁に囲まれた分岐</text><path class="floor" d="M60 600H490V720H350V860H230V720H60Z"/><rect class="wall" x="230" y="600" width="120" height="65"/><path class="path" d="M290 825V690H440"/><text x="70" y="897" class="small">約120〜180秒：壁の周囲と分岐</text>
<text x="600" y="555">④ 縦通路が続く区画</text><path class="floor" d="M650 600H780V730H1000V860H650Z" /><path class="path" d="M715 620V810H965"/><rect class="wall" x="800" y="600" width="200" height="110"/><text x="610" y="897" class="small">約190〜305秒：縦通路・曲がり角</text><text x="40" y="940" class="small">動画で見えた範囲の部分構造図。寸法・距離・配置は概略です。</text><text x="40" y="973" class="small">点線は移動の目安です。未確認の通路や階層間の戻り経路は補っていません。</text></svg>