<text x="550" y="873" font-size="18">Eirから入口へ移動、入口からLevel 1へ進み、入口へ戻る流れを動画で確認</text><text x="550" y="942" font-size="19" fill="#b8ccd9">青灰：確認できた床　黄：確認した移動　点線：未記録の先</text><text x="550" y="975" font-size="16" fill="#b8ccd9">2026-10-10の提供動画を参照</text></g></svg>