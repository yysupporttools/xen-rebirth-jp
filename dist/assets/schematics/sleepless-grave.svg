<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000"><defs><pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#344f64"/><path d="M0 0H40V40" fill="none" stroke="#486478"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#edd36f"/></marker></defs><rect width="1100" height="1000" fill="#102634"/><g font-family="Yu Gothic,Meiryo,sans-serif" text-anchor="middle" fill="#eaf3f8"><text x="550" y="55" font-size="30" font-weight="bold">Sleepless Grave：入口とLevel 1付近</text><text x="550" y="91" font-size="18" fill="#b8ccd9">動画から作成した構造図・確認できた範囲のみ／寸法・位置・縮尺は概略</text>
