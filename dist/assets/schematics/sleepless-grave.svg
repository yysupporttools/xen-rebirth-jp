<rect x="155" y="360" width="65" height="150" rx="9" fill="#526879" stroke="#aac0cc"/><text x="187" y="545" font-size="18">棺</text>
<ellipse cx="385" cy="400" rx="27" ry="55" fill="#526879" stroke="#aac0cc"/><text x="384" y="485" font-size="18">檻</text>
<circle cx="280" cy="703" r="35" fill="#76cfa5"/><text x="280" y="790" font-size="19">Eirからの到着地点</text>
