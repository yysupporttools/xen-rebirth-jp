<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000"><rect width="1100" height="1000" fill="#102632"/><style>text{font-family:Arial,'Yu Gothic',sans-serif;fill:#ecf5fb;font-size:22px}.small{font-size:18px;fill:#afc9da}.floor{fill:#526a76;stroke:#a9c4cf;stroke-width:4}.wall{fill:#142b38;stroke:#78919e;stroke-width:3}.path{fill:none;stroke:#ffdc73;stroke-width:5;stroke-dasharray:12 8}</style><text x="40" y="55" style="font-size:32px">Sleepless Grave (Level 1)</text><text x="40" y="95" class="small">到着地点 → 空洞の間の石橋 → 格子の壁際（動画 約8〜58秒）</text><text x="50" y="145">① 到着地点・広い床</text><path class="floor" d="M60 190H440V310H520V410H60Z"/><circle cx="480" cy="355" r="24" fill="#91ba72"/><text x="340" y="455" class="small">入口へ戻るポータル</text><path class="path" d="M460 355H130V240"/>
<text x="610" y="145">② 鎖のある空洞と石橋</text><path class="floor" d="M620 190H1000V260H860V480H760V260H620Z"/><rect class="wall" x="620" y="285" width="125" height="140"/><rect class="wall" x="875" y="285" width="125" height="140"/><text x="632" y="350" class="small">空洞</text><text x="885" y="350" class="small">空洞</text><path class="path" d="M670 225H810V445"/><text x="740" y="515" class="small">通路上にアーチ</text>
<text x="50" y="580">③ 格子のある壁際の床・Level 2への移動</text><rect class="floor" x="60" y="620" width="940" height="240"/><rect class="wall" x="60" y="620" width="940" height="60"/><path d="M70 630H990M70 650H990" stroke="#bbc5c4" stroke-width="3"/><text x="70" y="610" class="small">格子のある壁</text><circle cx="180" cy="780" r="24" fill="#d9a64f"/><text x="220" y="745">この付近からLevel 2へ（動画約58秒）</text><path class="path" d="M900 780H210"/><text x="50" y="903" class="small">①〜③は撮影順の部分図です。各図の方位・距離は統一していません。</text><text x="40" y="940" class="small">動画で見えた範囲の部分構造図。寸法・距離・配置は概略です。</text><text x="40" y="973" class="small">点線は移動の目安です。未確認の通路や階層間の戻り経路は補っていません。</text></svg>